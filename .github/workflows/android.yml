name: Build APK Android (Capacitor)

# Jobs: verificar (sintaxis, referencias y pruebas), build-apk (APK del dron), build-apk-aula (APK del aula)
# y firmware (compila el firmware del ESP32 del aula con PlatformIO).

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Acciones en versiones con Node 24 (las de Node 20 están obsoletas en GitHub).
# El Node del proyecto sigue siendo 20 (node-version), como pide Capacitor 5; la caché automática de setup-node queda apagada.
jobs:
  # Chequeos rápidos de sintaxis y referencias. Corre en paralelo con el build:
  # si falla, el APK igual se compila, pero el commit queda marcado en rojo.
  verificar:
    name: Verificar sintaxis y referencias
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v7

      - name: Configurar Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      - name: Sintaxis JavaScript (node --check)
        run: |
          for f in backend/public/js/*.js backend/public/sw.js backend/public-aula/js/*.js scripts/*.js; do
            node --check "$f" || exit 1
          done
          echo "JS OK"

      - name: Sintaxis PHP (php -l)
        run: |
          php -v
          find backend scripts -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Balance de llaves y referencias a archivos
        run: |
          python3 scripts/check_js.py
          python3 scripts/check_refs.py

      - name: Pruebas automáticas del seguimiento, el control real, la inclinación, Mis objetos y los botones (node --test)
        run: node --test tests/seguimiento.test.js tests/rac.test.js tests/control-real.test.js tests/inclinacion.test.js tests/objetos.test.js tests/botones.test.js

  build-apk:
    name: Compilar APK Debug del dron
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v7

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 5. Preparar www/ estático
        run: |
          node scripts/build-apk.js dron

      - name: 6. Instalar dependencias Capacitor
        working-directory: capacitor
        run: |
          npm install

      - name: 7. Inicializar plataforma Android (npx cap add android)
        working-directory: capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: 8. Copiar plugin Java y registrar en MainActivity
        working-directory: capacitor
        run: |
          # 8.1 Copiar plugin Java (sin Kotlin)
          mkdir -p android/app/src/main/java/ar/edu/eest1vl/grupo5dron/plugins
          cp android_plugin/DronNativePlugin.java android/app/src/main/java/ar/edu/eest1vl/grupo5dron/plugins/DronNativePlugin.java

          # 8.2 Registrar plugin en MainActivity.java antes de super.onCreate
          MAIN_ACTIVITY="android/app/src/main/java/ar/edu/eest1vl/grupo5dron/MainActivity.java"
          cat << 'EOF' > "$MAIN_ACTIVITY"
          package ar.edu.eest1vl.grupo5dron;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import ar.edu.eest1vl.grupo5dron.plugins.DronNativePlugin;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(DronNativePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: 9. Configurar permisos y Network Security Config
        working-directory: capacitor
        run: |
          # 9.1 Copiar network_security_config.xml
          mkdir -p android/app/src/main/res/xml
          cp network_security_config.xml android/app/src/main/res/xml/network_security_config.xml

          # 9.2 Inyectar permisos y networkSecurityConfig en AndroidManifest.xml
          python3 - << 'EOF'
          import re

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          permisos = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
          """

          # Insertar permisos si no están
          if "CHANGE_NETWORK_STATE" not in content:
              content = re.sub(r'(<manifest[^>]*>)', r'\1\n' + permisos, content, count=1)

          # Agregar android:networkSecurityConfig en <application> si no está
          if "android:networkSecurityConfig" not in content:
              content = re.sub(r'(<application\b)', r'\1 android:networkSecurityConfig="@xml/network_security_config"', content, count=1)

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)

          print("AndroidManifest.xml actualizado con permisos y network_security_config.")
          EOF

      - name: 10. Sincronizar proyecto Capacitor
        working-directory: capacitor
        run: |
          npx cap sync android

      # Firma fija del APK debug: así cada APK nuevo se instala encima del anterior sin desinstalar.
      # Gradle firma los debug con ~/.android/debug.keystore (alias androiddebugkey, contraseña android).
      # Si el secreto DEBUG_KEYSTORE_BASE64 no existe o no es válido, se usa la clave por defecto (el build no se rompe).
      - name: 10b. Instalar la clave de firma fija (si existe el secreto)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: bash scripts/ci_firma_debug.sh instalar

      - name: 11. Compilar APK Debug con Gradle
        working-directory: capacitor/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 11b. Verificar con qué clave quedó firmado el APK
        run: bash scripts/ci_firma_debug.sh verificar capacitor/android/app/build/outputs/apk/debug/app-debug.apk

      # Diagnóstico del modelo de seguimiento: el mismo archivo tiene que tener el mismo tamaño en el repo,
      # en www/, en los assets de Android y dentro del APK
      - name: 11c. Listar el modelo (repo, www, assets y APK)
        run: |
          echo "== Repo (backend/public/libs)"; ls -l backend/public/libs/coco-ssd backend/public/libs/tfjs
          echo "== www (generado por build-apk.js)"; ls -l capacitor/www/libs/coco-ssd capacitor/www/libs/tfjs
          echo "== Assets de Android"; ls -l capacitor/android/app/src/main/assets/public/libs/coco-ssd capacitor/android/app/src/main/assets/public/libs/tfjs
          echo "== Dentro del APK"; unzip -l capacitor/android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'coco-ssd|tfjs' || echo "(no aparecen en el APK)"

      - name: 12. Publicar artefacto APK Debug
        uses: actions/upload-artifact@v7
        with:
          name: Grupo5Dron-app-debug
          path: capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: 13. Informar tamaño del APK
        run: |
          APK_PATH="capacitor/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "📦 Tamaño del APK: $SIZE"
            echo "### 📦 APK generado: $SIZE" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠ APK no encontrado en $APK_PATH"
          fi

  # APK de la app del AULA: otra app (appId ar.edu.eest1vl.grupo5aula, "Grupo 5 Aula"), sin el plugin del dron.
  # Usa la misma clave de firma fija que el APK del dron.
  build-apk-aula:
    name: Compilar APK Debug del aula
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v7

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Preparar www/ estático del aula
        run: node scripts/build-apk.js aula

      - name: 5. Instalar dependencias Capacitor
        working-directory: capacitor-aula
        run: npm install

      - name: 6. Inicializar plataforma Android (npx cap add android)
        working-directory: capacitor-aula
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: 7. Sincronizar proyecto Capacitor
        working-directory: capacitor-aula
        run: npx cap sync android

      - name: 7b. Instalar la clave de firma fija (si existe el secreto)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: bash scripts/ci_firma_debug.sh instalar

      - name: 8. Compilar APK Debug con Gradle
        working-directory: capacitor-aula/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 8b. Verificar con qué clave quedó firmado el APK
        run: bash scripts/ci_firma_debug.sh verificar capacitor-aula/android/app/build/outputs/apk/debug/app-debug.apk

      - name: 9. Publicar artefacto APK Debug del aula
        uses: actions/upload-artifact@v7
        with:
          name: Grupo5Aula-app-debug
          path: capacitor-aula/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # Firmware del ESP32 del aula: compila con PlatformIO usando config.h.example como config.h
  # (config.h real no está en el repo). También compila el banco de pruebas de hardware.
  firmware:
    name: Compilar firmware ESP32 (PlatformIO)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: posibles-implementaciones/aula-esp32/firmware

    steps:
      - name: Checkout del código
        uses: actions/checkout@v7

      - name: Instalar PlatformIO
        run: |
          pipx install platformio
          pio --version

      - name: Compilar el firmware
        run: |
          cp src/config.h.example src/config.h
          pio run

      - name: Compilar el banco de pruebas (tests/test_hardware.ino)
        run: |
          pio ci tests/test_hardware.ino --board esp32dev \
            --project-option="lib_deps=crankyoldgit/IRremoteESP8266 @ ^2.8.6"
