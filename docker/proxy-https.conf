# ------------------------------------------------------------
# Grupo 5: Control de Sistemas y Dron — HTTPS para grupo5.40-160-138-65.sslip.io
# ------------------------------------------------------------
# OJO: en el servidor, /data/nginx/custom/http.conf tiene además el bloque de otro proyecto (control-aula).
# Para cambiar algo, editá SOLO estos bloques adentro de ese archivo: nunca lo reemplaces entero con este.
# Va en el Nginx Proxy Manager del servidor, en /data/nginx/custom/http.conf (el archivo de
# configuración propia que el proxy incluye y nunca pisa). Copia del formato de los otros sitios.
# El certificado se saca una vez con certbot dentro del contenedor del proxy (docs/despliegue-hosting.md).
server {
  set $forward_scheme http;
  set $server         "grupo5-web";
  set $port           80;

  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name grupo5.40-160-138-65.sslip.io;
  http2 on;

  # Let's Encrypt SSL
  include conf.d/include/letsencrypt-acme-challenge.conf;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/grupo5-sslip/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/grupo5-sslip/privkey.pem;

  # Block Exploits
  include conf.d/include/block-exploits.conf;

  # Force SSL
  set $trust_forwarded_proto "F";
  include conf.d/include/force-ssl.conf;


  access_log /data/logs/proxy-host-grupo5_access.log proxy;
  error_log /data/logs/proxy-host-grupo5_error.log warn;

  location / {
    proxy_http_version 1.1;
    include conf.d/include/proxy.conf;
  }
}

# ------------------------------------------------------------
# Grupo 5 por la IP sola: https://40.160.138.65 (26/11/2026)
# ------------------------------------------------------------
# Algunas redes no resuelven sslip.io (sus DNS lo bloquean): con la IP no hace falta ningún DNS.
# Certificado de Let's Encrypt para la IP (perfil "shortlived", dura ~6 días; se renueva solo cada 3,
# con cron y renew_before_expiry = 3 days en su archivo de renovación). Por http (puerto 80) también
# responde, sin redirigir, para que la renovación siempre pueda leer el desafío.
server {
  set $forward_scheme http;
  set $server         "grupo5-web";
  set $port           80;

  listen 80;
  listen [::]:80;
  # Por la IP el navegador no manda nombre (SNI): sin default_server, nginx usaría el sitio por defecto del proxy,
  # que corta la conexión. Este pasa a ser el de 443, pero solo atiende pedidos a la IP (cualquier otro: 444).
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;

  server_name 40.160.138.65;
  if ($host != "40.160.138.65") { return 444; }
  http2 on;

  include conf.d/include/letsencrypt-acme-challenge.conf;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/grupo5-ip/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/grupo5-ip/privkey.pem;

  include conf.d/include/block-exploits.conf;

  access_log /data/logs/proxy-host-grupo5-ip_access.log proxy;
  error_log /data/logs/proxy-host-grupo5-ip_error.log warn;

  location / {
    proxy_http_version 1.1;
    include conf.d/include/proxy.conf;
  }
}
