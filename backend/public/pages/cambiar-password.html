<div class="login-contenedor">
    <form id="form-cambiar-password" class="login-form tarjeta" novalidate>
        <div class="login-form__logo">🔑</div>
        <h2 class="login-form__titulo">Cambiar contraseña</h2>
        <p class="login-form__subtitulo">Grupo 5 — EEST N° 1</p>

        <div id="aviso-cambio-obligatorio" class="advertencia-seguridad" style="display:none;">
            <span class="advertencia-seguridad__icono">⚠️</span>
            <span>Tu cuenta tiene una contraseña temporal. Para seguir, elegí una nueva.</span>
        </div>

        <div class="campo">
            <label class="campo__label" for="password-actual">Contraseña actual</label>
            <input class="campo__input" id="password-actual" type="password" autocomplete="current-password" required>
        </div>

        <div class="campo">
            <label class="campo__label" for="password-nueva">Nueva contraseña (mínimo 8 caracteres)</label>
            <input class="campo__input" id="password-nueva" type="password" autocomplete="new-password" minlength="8" required>
        </div>

        <div class="campo">
            <label class="campo__label" for="password-repetida">Repetí la nueva contraseña</label>
            <input class="campo__input" id="password-repetida" type="password" autocomplete="new-password" minlength="8" required>
        </div>

        <button type="submit" class="btn btn--primario btn--bloque mt-lg">Guardar contraseña</button>
    </form>
</div>
