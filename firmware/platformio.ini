; PlataformIO Configuration — Grupo 5: Control de Sistemas y Dron
; EEST N° 1 de Vicente López "Eduardo Ader" — 7° 2°
; Firmware ESP32 DevKit (IR + Relé + HTTPS Client)
; ============================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Velocidad del puerto serie
monitor_speed = 115200
upload_speed = 921600

; Filtros para visualización limpia en consola
monitor_filters = 
    esp32_exception_decoder
    time
    colorize

; Dependencias de librerías
lib_deps =
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    bblanchon/ArduinoJson @ ^6.21.4

; Tabla de particiones con mayor espacio de aplicación (1.9 MB para app, 190 KB SPIFFS)
board_build.partitions = min_spiffs.csv

; Flags de compilación
build_flags = 
    -D CONFIG_ARDUHAL_LOG_COLORS=1
